<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Krypto-3D Maker Chip</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px;

            background:
                radial-gradient(circle at 20% 10%, rgba(255, 55, 35, 0.16), transparent 35%),
                radial-gradient(circle at 80% 90%, rgba(0, 220, 255, 0.13), transparent 35%),
                #08090b;

            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .card {
            position: relative;

            width: 100%;
            max-width: 430px;

            padding: 22px 22px 24px;

            background: rgba(18, 20, 24, 0.97);

            border: 1px solid rgba(255, 70, 45, 0.65);
            border-radius: 28px;

            box-shadow:
                0 0 18px rgba(255, 55, 30, 0.30),
                0 0 45px rgba(255, 55, 30, 0.10),
                inset 0 0 25px rgba(255,255,255,0.025);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 28px;
            pointer-events: none;

            background: linear-gradient(
                135deg,
                rgba(255, 65, 35, 0.95),
                rgba(255, 65, 35, 0.05),
                rgba(0, 220, 255, 0.75)
            );

            padding: 1px;

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        /* LOGO */

        .logo-wrap {
            position: relative;
            width: 190px;
            max-width: 65%;
            margin: 0 auto 4px;
        }

        .logo-wrap::before {
            content: "";
            position: absolute;
            inset: 15%;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 60, 35, 0.20),
                    rgba(0, 220, 255, 0.08),
                    transparent 70%
                );

            filter: blur(20px);
        }

        .logo {
            position: relative;
            display: block;
            width: 100%;

            /*
              Schwarzer Hintergrund des Logos
              verschmilzt optisch mit der Karte.
            */
            mix-blend-mode: screen;

            filter:
                drop-shadow(0 0 8px rgba(255, 60, 35, 0.30))
                drop-shadow(0 0 12px rgba(0, 220, 255, 0.12));
        }

        /* TITEL */

        h1 {
            margin: 0;
            font-size: 29px;
            letter-spacing: 3px;
        }

        .subtitle {
            margin-top: 6px;

            color: #9298a0;

            font-size: 11px;
            letter-spacing: 3px;
        }

        .divider {
            width: 90px;
            height: 2px;

            margin: 20px auto 22px;

            background: linear-gradient(
                90deg,
                #ff4933,
                #00dff5
            );

            box-shadow:
                0 0 10px rgba(255, 73, 51, 0.70),
                0 0 10px rgba(0, 223, 245, 0.55);
        }

        /* NUMMER */

        .number {
            font-size: 76px;
            line-height: 0.95;

            font-weight: 900;
            letter-spacing: 2px;

            color: white;

            text-shadow:
                3px 3px 0 rgba(255, 60, 35, 0.45),
                -2px -1px 0 rgba(0, 215, 240, 0.35);
        }

        .total {
            margin-top: 7px;

            font-size: 19px;
            color: #a5abb2;
        }

        .total span {
            color: #00dff5;

            text-shadow:
                0 0 9px rgba(0, 223, 245, 0.80);
        }

        /* VERSION */

        .version {
            display: inline-block;

            margin-top: 22px;
            padding: 8px 17px;

            border: 1px solid rgba(255, 73, 51, 0.85);
            border-radius: 100px;

            color: #ff5a43;

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;

            box-shadow:
                0 0 12px rgba(255, 73, 51, 0.20);
        }

        /* SERIENNUMMER */

        .serial-label {
            margin-top: 20px;

            color: #636b73;

            font-size: 9px;
            letter-spacing: 3px;
        }

        .serial {
            margin-top: 6px;

            color: #d9dde0;

            font-family: monospace;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .limited {
            margin-top: 19px;

            color: #00dff5;

            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2.5px;

            text-shadow:
                0 0 8px rgba(0, 223, 245, 0.50);
        }

        /* TIKTOK */

        .tiktok-button {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            width: 100%;

            margin-top: 21px;
            padding: 13px 16px;

            border: 1px solid #00dff5;
            border-radius: 14px;

            background:
                linear-gradient(
                    120deg,
                    rgba(255, 73, 51, 0.11),
                    rgba(0, 223, 245, 0.10)
                );

            color: white;
            text-decoration: none;

            font-weight: bold;
            font-size: 14px;
            letter-spacing: 2px;

            box-shadow:
                0 0 14px rgba(0, 223, 245, 0.18),
                inset 0 0 12px rgba(255, 73, 51, 0.05);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .tiktok-button:active {
            transform: scale(0.97);

            box-shadow:
                0 0 20px rgba(0, 223, 245, 0.30);
        }

        /* Neon-Musiknote */

        .tiktok-icon {
            position: relative;

            width: 25px;
            height: 27px;

            flex-shrink: 0;
        }

        .tiktok-icon::before,
        .tiktok-icon::after {
            content: "♪";

            position: absolute;
            top: -5px;
            left: 3px;

            font-size: 27px;
            font-weight: bold;
        }

        .tiktok-icon::before {
            color: #ff4055;
            transform: translate(-2px, 2px);
            text-shadow: 0 0 7px rgba(255, 64, 85, 0.8);
        }

        .tiktok-icon::after {
            color: #00f2ea;
            transform: translate(2px, -1px);
            text-shadow: 0 0 7px rgba(0, 242, 234, 0.8);
        }

        .tiktok-name {
            color: #00dff5;

            text-shadow:
                0 0 7px rgba(0, 223, 245, 0.45);
        }

        /* FOOTER */

        .footer {
            margin-top: 18px;

            color: #50565c;

            font-size: 9px;
            letter-spacing: 2px;
        }

    </style>
</head>

<body>

<div class="card">

    <div class="logo-wrap">
        <img
            src="logo.png"
            alt="Krypto-3D Logo"
            class="logo"
        >
    </div>

    <h1>MAKER CHIP</h1>

    <div class="subtitle">
        LIMITED MAKER SERIES
    </div>

    <div class="divider"></div>

    <div
        class="number"
        id="number"
    >
        001
    </div>

    <div class="total">
        OF <span id="total">025</span>
    </div>

    <div class="version">
        VERSION <span id="version">1</span>
    </div>

    <div class="serial-label">
        SERIAL NUMBER
    </div>

    <div
        class="serial"
        id="serial"
    >
        KMC-V01-001
    </div>

    <div class="limited">
        ◇ ORIGINAL MAKER CHIP ◇
    </div>

    <a
        class="tiktok-button"
        href="https://www.tiktok.com/@._.krypto_"
        target="_blank"
        rel="noopener noreferrer"
    >
        <span class="tiktok-icon"></span>

        <span>
            TIKTOK
        </span>

        <span class="tiktok-name">
            @._.krypto_
        </span>
    </a>

    <div class="footer">
        KRYPTO-3D • 2026
    </div>

</div>


<script>

    const params =
        new URLSearchParams(window.location.search);

    const version =
        parseInt(params.get("v")) || 1;

    const number =
        parseInt(params.get("nr")) || 1;

    /*
        Gesamtanzahl je Version.

        Später z.B.:

        1: 25,
        2: 50,
        3: 25
    */

    const versionTotals = {
        1: 25
    };

    const total =
        versionTotals[version] || 25;

    const formattedNumber =
        String(number).padStart(3, "0");

    const formattedTotal =
        String(total).padStart(3, "0");

    const formattedVersion =
        String(version).padStart(2, "0");

    document
        .getElementById("number")
        .textContent =
        formattedNumber;

    document
        .getElementById("total")
        .textContent =
        formattedTotal;

    document
        .getElementById("version")
        .textContent =
        version;

    document
        .getElementById("serial")
        .textContent =
        "KMC-V" +
        formattedVersion +
        "-" +
        formattedNumber;

</script>

</body>
</html>
